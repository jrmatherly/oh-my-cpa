# Air hot-reload configuration for `pnpm dev:api` (backend only) or `pnpm dev` (backend and
# frontend). The backend reads .env itself, so nothing is injected here. Air does not start
# CPA: run `pnpm cpa:start` or use your own CPA.
root = "."
testdata_dir = "tmp"
tmp_dir = "tmp/air"

[build]
  args_bin = []
  bin = "./tmp/air/main.exe"
  cmd = "go build -o ./tmp/air/main.exe ./cmd/oh-my-cpa"
  delay = 500
  exclude_dir = ["assets", "tmp", "cpa", "web", "docs", "deploy", "scripts", "internal/web/dist"]
  exclude_file = []
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = true
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "sql"]
  # The language instructions are embedded in the backend, not loaded by Vite.
  include_file = ["internal/agent/openui/openui.json"]
  kill_delay = "500ms"
  log = "tmp/air/build-errors.log"
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = true
  main_only = false

[misc]
  clean_on_exit = true

[proxy]
  enabled = false
  proxy_port = 0
